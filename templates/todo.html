<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To_Do List</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="card">
        <h1> MY TO_DO LIST</h1>
        <form class="add_form" action="{{url_for('add_todo')}}" method="POST">
                <input type="text" name="task" placeholder="what needs doing?" required autofocus>
     <button type="submit" class="btn btn_primary">Add</button></form>
     {% if todos %}
     <ul class="todo_list">
        {% for todo in todos %}
        <li class="todo_item">
            <span class="task">{{todo.task}}</span>
            <div class="action">
                <a href="{{url_for('edit_todo',todo_id=todo.id)}}" class="btn btn_edit">Edit</a>
                        <form action="{{url_for ('delete_todo',todo_id=todo.id)}}" method="POST" onsubmit="return confirm('Delete this task?');">
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>

        
            </div>
            </li>
    {% endfor %}
     </ul>
{% else %}
<p class="empty">nothing here yet.Add your first task above</p>
    {% endif %}
    </div>
</body>
</html>
